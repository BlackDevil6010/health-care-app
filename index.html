<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Healthcare Assistant</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Custom Font & Animations */
    body {
      font-family: 'Times New Roman', Times, serif;
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in-up {
      animation: fade-in-up 0.5s ease-out forwards;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .animate-float {
        animation: float 4s ease-in-out infinite;
    }
    
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.4), 0 0 15px rgba(59, 130, 246, 0.3);
      }
      50% {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), 0 0 30px rgba(59, 130, 246, 0.5);
      }
    }
    .animate-pulse-glow {
        animation: pulse-glow 2.5s infinite;
    }

    @keyframes progress-indeterminate {
      0% { transform: translateX(-100%) scaleX(0.5); }
      50% { transform: translateX(0) scaleX(0.2); }
      100% { transform: translateX(100%) scaleX(0.5); }
    }
    
    @keyframes pop-in {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
    .animate-pop-in {
        animation: pop-in 0.3s ease-out forwards;
    }
    
    @keyframes subtle-pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
    }
    .animate-subtle-pulse {
        animation: subtle-pulse 3s infinite ease-in-out;
    }

  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
    }
  }
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
